name: transport

# ── Production / staging stack ──
# This stack is independent from the Sail dev stack at backend/compose.yaml.
# Do NOT run both stacks simultaneously — they share the same DB/REDIS host
# port defaults (54320 / 63790) and will conflict.

services:
  # ── Nginx ──
  nginx:
    image: nginx:alpine
    container_name: transport-nginx
    ports:
      - '${NGINX_PORT:-8080}:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
      - ./backend/storage/app/public:/var/www/backend/storage/app/public:ro
    depends_on:
      php:
        condition: service_started
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - appnet
    restart: unless-stopped

  # ── PHP-FPM ──
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: transport-php
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: '${APP_ENV:-production}'
      APP_DEBUG: '${APP_DEBUG:-false}'
      APP_URL: '${APP_URL:-http://localhost:8080}'
      APP_KEY: '${APP_KEY}'
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: '5432'
      DB_DATABASE: '${DB_DATABASE:-transport}'
      DB_USERNAME: '${DB_USERNAME:-transport}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-null}'
      SESSION_DRIVER: redis
      SESSION_ENCRYPT: 'true'
      SESSION_SECURE_COOKIE: '${SESSION_SECURE_COOKIE:-true}'
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      FILESYSTEM_DISK: local
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      SANCTUM_STATEFUL_DOMAINS: '${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:8080}'
      SESSION_LIFETIME: '120'
      FRONTEND_URL: '${FRONTEND_URL}'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9000 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

  # ── PostgreSQL ──
  pgsql:
    image: postgres:18-alpine
    container_name: transport-pgsql
    ports:
      - '${FORWARD_DB_PORT:-54320}:5432'
    environment:
      POSTGRES_DB: '${DB_DATABASE:-transport}'
      POSTGRES_USER: '${DB_USERNAME:-transport}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      # postgres:18+ images use major-versioned subdirectories under
      # /var/lib/postgresql — mounting the legacy /data path is an error.
      - pgsql-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE:-transport}', '-U', '${DB_USERNAME:-transport}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet
    restart: unless-stopped

  # ── Redis ──
  redis:
    image: redis:alpine
    container_name: transport-redis
    ports:
      - '${FORWARD_REDIS_PORT:-63790}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet
    restart: unless-stopped

  # ── Queue Worker (Horizon) ──
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: transport-queue
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: '${APP_ENV:-production}'
      APP_DEBUG: '${APP_DEBUG:-false}'
      APP_URL: '${APP_URL:-http://localhost:8080}'
      APP_KEY: '${APP_KEY}'
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: '5432'
      DB_DATABASE: '${DB_DATABASE:-transport}'
      DB_USERNAME: '${DB_USERNAME:-transport}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-null}'
      SESSION_DRIVER: redis
      SESSION_ENCRYPT: 'true'
      SESSION_SECURE_COOKIE: '${SESSION_SECURE_COOKIE:-true}'
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      FILESYSTEM_DISK: local
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      SANCTUM_STATEFUL_DOMAINS: '${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:8080}'
      SESSION_LIFETIME: '120'
      FRONTEND_URL: '${FRONTEND_URL}'
    command: ['php', 'artisan', 'horizon']
    healthcheck:
      test: ['CMD-SHELL', 'php artisan horizon:status || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

  # ── Scheduler (cron loop for artisan schedule:work) ──
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: transport-scheduler
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: '${APP_ENV:-production}'
      APP_DEBUG: '${APP_DEBUG:-false}'
      APP_URL: '${APP_URL:-http://localhost:8080}'
      APP_KEY: '${APP_KEY}'
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: '5432'
      DB_DATABASE: '${DB_DATABASE:-transport}'
      DB_USERNAME: '${DB_USERNAME:-transport}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-null}'
      SESSION_DRIVER: redis
      SESSION_ENCRYPT: 'true'
      SESSION_SECURE_COOKIE: '${SESSION_SECURE_COOKIE:-true}'
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      FILESYSTEM_DISK: local
      LOG_LEVEL: '${LOG_LEVEL:-info}'
      SANCTUM_STATEFUL_DOMAINS: '${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:8080}'
      SESSION_LIFETIME: '120'
      FRONTEND_URL: '${FRONTEND_URL}'
    command: ['php', 'artisan', 'schedule:work', '--verbose', '--no-interaction']
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

volumes:
  pgsql-data:
    driver: local
  redis-data:
    driver: local

networks:
  appnet:
    driver: bridge
