server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;
    server_tokens off;

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Security headers ──
    # NOTE: nginx does not inherit add_header into a location that defines its
    # own add_header. These are repeated in every location below on purpose.
    # Enable Strict-Transport-Security here when this server terminates TLS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Frontend SPA ──
    location / {
        root /var/www/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ── Frontend assets (cache-busted) ──
    location /assets/ {
        root /var/www/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ── API backend — pass all /api/* requests to Laravel ──
    # NOTE: ^~ skips regex location evaluation below, so requests like
    # /api/*/export.json are proxied instead of being caught by the
    # sensitive-extension deny rules (which protect the frontend webroot).
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param APP_ENV production;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Sanctum CSRF ──
    location ^~ /sanctum/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param APP_ENV production;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Scramble API docs (authorization enforced by Laravel viewApiDocs gate) ──
    location ^~ /docs/api {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param APP_ENV production;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Laravel storage (public files) ──
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ── Deny hidden / sensitive files ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|sqlite|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
