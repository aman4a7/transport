server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Frontend SPA ──
    location / {
        root /var/www/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Frontend assets (cache-busted) ──
    location /assets/ {
        root /var/www/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API backend — pass all /api/* requests to Laravel ──
    location /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param APP_ENV production;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_read_timeout 120s;
    }

    # ── Sanctum CSRF ──
    location /sanctum/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param APP_ENV production;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_read_timeout 120s;
    }

    # ── Laravel storage (public files) ──
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Deny hidden / sensitive files ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|sqlite|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
